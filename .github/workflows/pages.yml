# Publie le site sur GitHub Pages à chaque envoi sur main :
# https://muriellekpinso.github.io/Benin3D/
# À faire une fois dans les réglages du dépôt :
#   Settings → Pages → Source : « GitHub Actions »
#   Settings → Secrets and variables → Actions → New repository secret :
#     VITE_GOOGLE_MAPS_KEY = la clé Google Maps (facultatif ; la restreindre à
#     https://muriellekpinso.github.io/* dans la console Google Cloud)
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
